[project]
name = "ai-support-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "groq>=1.4.0",
    "langgraph>=1.2.4",
    "lxml>=6.1.1",
    "neo4j>=6.2.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
    "supabase>=2.31.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
